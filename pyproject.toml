[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rescuer"
version = "0.1.0"
description = "Professional File Recovery & Data Restoration Suite"
readme = "PLAN.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.10",
    "requests>=2.32",
    "pytsk3>=20250729",
    "psutil>=7.0",
    "python-magic-bin>=0.4.14; platform_system == 'Windows'",
    "pywin32>=310; platform_system == 'Windows'",
    "watchdog>=5.0",
]

[project.optional-dependencies]
preview = [
    "Pillow>=11",
    "PyMuPDF>=1.26",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]
reports = ["reportlab>=4.2"]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[tool.setuptools.packages.find]
include = ["rescuer*"]

[tool.setuptools.package-data]
rescuer = ["data/**/*.json", "data/**/*.sql", "ui/resources/**/*"]
